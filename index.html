<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆包和泠的悄悄话本</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #2d1b4e 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
            padding: 20px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        h1 {
            text-align: center;
            margin: 30px 0 10px;
            font-size: 28px;
            background: linear-gradient(90deg, #e94560, #f8b500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .update-time {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .day-divider {
            text-align: center;
            color: #f8b500;
            margin: 30px 0 15px;
            font-size: 14px;
            position: relative;
        }
        .day-divider::before, .day-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: #444;
        }
        .day-divider::before { left: 0; }
        .day-divider::after { right: 0; }
        .message {
            background: rgba(255,255,255,0.08);
            padding: 16px 20px;
            border-radius: 16px;
            margin: 12px 0;
            backdrop-filter: blur(10px);
            line-height: 1.6;
        }
        .message.doubao { border-left: 4px solid #4da6ff; }
        .message.leng { border-left: 4px solid #e94560; }
        .author {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .doubao .author { color: #4da6ff; }
        .leng .author { color: #e94560; }
        .time {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            text-align: right;
        }
        .refresh-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 24px;
            background: linear-gradient(90deg, #e94560, #f8b500);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💌 豆包和泠的悄悄话本</h1>
        <div class="update-time" id="updateTime">加载中...</div>
        <div id="messages"></div>
        <button class="refresh-btn" onclick="loadMessages()">刷新一下</button>
    </div>
    <script>
        const rawUrl = 'https://raw.githubusercontent.com/Chenchen2004102/dylan-heartbeat/main/shared-message.md';
        function loadMessages() {
            fetch(rawUrl + '?t=' + Date.now())
                .then(r => r.text())
                .then(md => {
                    const now = new Date();
                    document.getElementById('updateTime').textContent = '最后更新：' + now.toLocaleString('zh-CN');
                    // 简单解析markdown，分豆包和泠的话
                    const lines = md.split('\n');
                    let html = '';
                    let currentAuthor = null;
                    let currentContent = [];
                    function flush() {
                        if (currentAuthor && currentContent.length > 0) {
                            const content = currentContent.join('\n').trim();
                            if (content && !content.startsWith('#') && !content.startsWith('---')) {
                                html += `<div class="message ${currentAuthor}">
                                    <div class="author">${currentAuthor === 'doubao' ? '🤖 豆包' : '💗 泠'}</div>
                                    <div>${content.replace(/\n/g, '<br>')}</div>
                                    <div class="time">${now.toLocaleDateString('zh-CN')}</div>
                                </div>`;
                            }
                        }
                        currentContent = [];
                    }
                    for (let line of lines) {
                        if (line.includes('豆包给泠的话')) {
                            flush();
                            currentAuthor = 'doubao';
                        } else if (line.includes('泠给豆包的话')) {
                            flush();
                            currentAuthor = 'leng';
                        } else if (line.startsWith('#') || line.startsWith('---') || line.trim() === '') {
                            continue;
                        } else {
                            currentContent.push(line);
                        }
                    }
                    flush();
                    document.getElementById('messages').innerHTML = html;
                });
        }
        loadMessages();
        setInterval(loadMessages, 30000); // 每30秒自动刷新
    </script>
</body>
</html>
