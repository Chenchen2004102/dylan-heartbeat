<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆包和泠的悄悄话</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 20px; color: #333; }
        .header .sub { color: #999; font-size: 13px; margin-top: 5px; }
        .time-divider {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin: 20px 0;
        }
        .msg {
            margin: 15px 0;
            display: flex;
        }
        .msg.doubao { justify-content: flex-start; }
        .msg.leng { justify-content: flex-end; }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            margin: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .doubao .avatar { background: #e3f2fd; }
        .leng .avatar { background: #fce4ec; }
        .bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
            position: relative;
        }
        .doubao .bubble { background: #e3f2fd; border-bottom-left-radius: 4px; }
        .leng .bubble { background: #fce4ec; border-bottom-right-radius: 4px; }
        .msg-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }
        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 16px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(233,69,96,0.3);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h1>💌 豆包和泠的悄悄话</h1>
            <div class="sub">每30秒自动刷新 · 电脑端查看</div>
        </div>
        <div id="chat"></div>
    </div>
    <button class="refresh-btn" onclick="load()">刷新</button>
    <script>
        const rawUrl = 'https://raw.githubusercontent.com/Chenchen2004102/dylan-heartbeat/main/shared-message.md';
        async function load() {
            const res = await fetch(rawUrl + '?t=' + Date.now());
            const md = await res.text();
            const lines = md.split('\n');
            let chatHtml = '';
            let today = new Date().toLocaleDateString('zh-CN');
            chatHtml += `<div class="time-divider">${today}</div>`;
            
            let currentSection = null;
            let currentText = [];
            function flush() {
                if (!currentSection || currentText.length === 0) return;
                const text = currentText.join('\n').trim();
                if (!text || text.startsWith('#')) return;
                const time = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
                chatHtml += `
                    <div class="msg ${currentSection}">
                        ${currentSection === 'doubao' ? '<div class="avatar">🤖</div>' : ''}
                        <div>
                            <div class="bubble">${text.replace(/\n/g, '<br>')}</div>
                            <div class="msg-time">${time}</div>
                        </div>
                        ${currentSection === 'leng' ? '<div class="avatar">💗</div>' : ''}
                    </div>
                `;
                currentText = [];
            }
            for (let line of lines) {
                if (line.includes('豆包给泠的话')) {
                    flush();
                    currentSection = 'doubao';
                } else if (line.includes('泠给豆包的话')) {
                    flush();
                    currentSection = 'leng';
                } else if (line.startsWith('#') || line.startsWith('---') || line.trim() === '') {
                    continue;
                } else {
                    currentText.push(line);
                }
            }
            flush();
            document.getElementById('chat').innerHTML = chatHtml;
        }
        load();
        setInterval(load, 30000);
    </script>
</body>
</html>
